name: ci
on: [push, pull_request]
jobs:
  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash ../scripts/check-bundle-size.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  vendored-bundle-is-fresh:
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: bash scripts/vendor.sh
      - name: bundle in git matches built bundle
        run: |
          git diff --exit-code py/bigraph_viz2/_bundle/ \
            || (echo "vendored bundle out of date — run scripts/vendor.sh and commit"; exit 1)

  py:
    runs-on: ubuntu-latest
    needs: vendored-bundle-is-fresh
    defaults: { run: { working-directory: py } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -v
